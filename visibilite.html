<title>Plan de visibilité — EC Menuiserie</title>
<style>
  :root {
    --wood: #8a5a3b;
    --wood-dark: #5e3d28;
    --bg: #faf6f1;
    --card: #ffffff;
    --text: #2b2320;
    --muted: #8a7f76;
    --done: #4a7c59;
    --border: #e6ddd3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 16px;
  }
  .header {
    text-align: center;
    margin-bottom: 20px;
  }
  .header h1 {
    font-size: 1.3rem;
    margin: 0 0 4px 0;
    color: var(--wood-dark);
  }
  .header p {
    margin: 0;
    color: var(--muted);
    font-size: 0.85rem;
  }
  .progress-wrap {
    background: var(--card);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 20px;
    border: 1px solid var(--border);
  }
  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 0.85rem;
    margin-bottom: 8px;
    color: var(--muted);
  }
  .progress-bar-bg {
    background: var(--border);
    border-radius: 999px;
    height: 10px;
    overflow: hidden;
  }
  .progress-bar-fill {
    background: var(--wood);
    height: 100%;
    border-radius: 999px;
    transition: width 0.3s ease;
  }
  .phase {
    margin-bottom: 18px;
  }
  .phase-title {
    font-size: 1rem;
    font-weight: 700;
    color: var(--wood-dark);
    margin: 0 0 10px 4px;
  }
  .step {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 10px;
    overflow: hidden;
  }
  .step-header {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 12px 14px;
    cursor: pointer;
  }
  .checkbox {
    flex-shrink: 0;
    width: 24px;
    height: 24px;
    border-radius: 6px;
    border: 2px solid var(--wood);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 2px;
    transition: all 0.15s ease;
  }
  .checkbox.checked {
    background: var(--done);
    border-color: var(--done);
  }
  .checkbox svg {
    width: 14px;
    height: 14px;
    display: none;
  }
  .checkbox.checked svg { display: block; }
  .step-title {
    font-weight: 600;
    font-size: 0.95rem;
    flex: 1;
  }
  .step.checked .step-title {
    text-decoration: line-through;
    color: var(--muted);
  }
  .expand-arrow {
    color: var(--muted);
    font-size: 0.75rem;
    margin-top: 4px;
    transition: transform 0.15s ease;
  }
  .expand-arrow.open { transform: rotate(90deg); }
  .step-detail {
    display: none;
    padding: 0 14px 14px 48px;
    font-size: 0.88rem;
    line-height: 1.5;
    color: var(--text);
  }
  .step-detail.open { display: block; }
  .step-detail ol, .step-detail ul {
    margin: 0;
    padding-left: 18px;
  }
  .step-detail li { margin-bottom: 6px; }
  .step-detail pre {
    background: #f3ede4;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    white-space: pre-wrap;
    font-family: inherit;
    font-size: 0.85rem;
    margin: 8px 0;
  }
  .copy-btn {
    background: var(--wood);
    color: white;
    border: none;
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 0.78rem;
    cursor: pointer;
    margin-top: 4px;
  }
  .copy-btn:active { opacity: 0.7; }
  .reset-btn {
    display: block;
    margin: 24px auto 8px auto;
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 0.8rem;
  }
  .status {
    text-align: center;
    font-size: 0.75rem;
    color: var(--muted);
    margin-top: 4px;
    min-height: 14px;
  }
</style>
</head>
<body>

<div class="header">
  <h1>🪵 Plan de visibilité en ligne</h1>
  <p>EC Menuiserie — coche chaque étape au fur et à mesure</p>
</div>

<div class="progress-wrap">
  <div class="progress-label">
    <span id="progress-text">0 / 0 étapes</span>
    <span id="progress-pct">0%</span>
  </div>
  <div class="progress-bar-bg">
    <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
  </div>
</div>

<div id="app"></div>

<button class="reset-btn" id="reset-btn">Réinitialiser toute la progression</button>
<div class="status" id="status"></div>

<script>
const DATA = [

          <li>Remplis catégorie, zone d'intervention, horaires, description</li>

          <li>Ouvre les 4 fiches côte à côte (Google, Facebook, Instagram, Pages Jaunes)</li>
          <li>Vérifie que le nom de l'entreprise est identique partout</li>
          <li>Vérifie que le téléphone est écrit dans le même format partout</li>

  {

          <button class="copy-btn" data-copy="txt1">Copier ce texte</button>

];

const STORAGE_KEY = 'ec-menuiserie-checklist-progress';
let progress = {};

function totalSteps() {
  return DATA.reduce((acc, p) => acc + p.steps.length, 0);
}

function updateProgress() {
  const total = totalSteps();
  const done = Object.values(progress).filter(Boolean).length;
  const pct = total ? Math.round((done / total) * 100) : 0;
  document.getElementById('progress-text').textContent = `${done} / ${total} étapes`;
  document.getElementById('progress-pct').textContent = `${pct}%`;
  document.getElementById('progress-fill').style.width = pct + '%';
}

function saveProgress() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
  } catch (e) {
    console.error('Erreur de sauvegarde', e);
    showStatus("Sauvegarde impossible sur cet appareil.");
  }
}

function loadProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      progress = JSON.parse(raw);
    }
  } catch (e) {
    progress = {};
  }
}

function showStatus(msg) {
  const el = document.getElementById('status');
  el.textContent = msg;
  setTimeout(() => { el.textContent = ''; }, 1500);
}

function render() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  DATA.forEach(phase => {
    const phaseDiv = document.createElement('div');
    phaseDiv.className = 'phase';
    const title = document.createElement('div');
    title.className = 'phase-title';
    title.textContent = phase.phase;
    phaseDiv.appendChild(title);

    phase.steps.forEach(step => {
      const stepDiv = document.createElement('div');
      stepDiv.className = 'step' + (progress[step.id] ? ' checked' : '');
      stepDiv.id = 'step-' + step.id;

      const header = document.createElement('div');
      header.className = 'step-header';

      const checkbox = document.createElement('div');
      checkbox.className = 'checkbox' + (progress[step.id] ? ' checked' : '');
      checkbox.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>';
      checkbox.onclick = (e) => {
        e.stopPropagation();
        progress[step.id] = !progress[step.id];
        saveProgress();
        updateProgress();
        render();
      };

      const titleSpan = document.createElement('div');
      titleSpan.className = 'step-title';
      titleSpan.textContent = step.title;

      const arrow = document.createElement('div');
      arrow.className = 'expand-arrow';
      arrow.textContent = '▶';

      header.appendChild(checkbox);
      header.appendChild(titleSpan);
      header.appendChild(arrow);

      const detail = document.createElement('div');
      detail.className = 'step-detail';
      detail.innerHTML = step.html;

      header.onclick = () => {
        detail.classList.toggle('open');
        arrow.classList.toggle('open');
      };

      stepDiv.appendChild(header);
      stepDiv.appendChild(detail);
      phaseDiv.appendChild(stepDiv);
    });

    app.appendChild(phaseDiv);
  });

  // wire copy buttons
  document.querySelectorAll('.copy-btn').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      const targetId = btn.getAttribute('data-copy');
      const text = document.getElementById(targetId).textContent;
      navigator.clipboard.writeText(text).then(() => {
        showStatus('Texte copié !');
      }).catch(() => {
        showStatus('Copie impossible sur cet appareil.');
      });
    };
  });

  updateProgress();
}

document.getElementById('reset-btn').onclick = () => {
  progress = {};
  saveProgress();
  render();
  showStatus('Progression réinitialisée.');
};

loadProgress();
render();
</script>
